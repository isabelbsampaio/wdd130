<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Angola Rafting</title>
    <meta name="description"
      content="The Whitewater Rafting Site | Ask questions about the company and the services | WDD30 | Project Site">
    <meta name="author" content="Isabel Bica De Sousa Sampaio">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingcompas.jpg" alt="Whitewater Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>


    <main>
        <div class="contact">
            <h1>Angola Rafting Company</h1>
            <article>
                <p>944 New Land Street</p>
                <p>Talatona, Luanda</p>
                <p>+244 923 923 923</p>
                <p>info@angola_rafting.com</p>
            </article>
        </div>

        <section class="contact-area">
            <div class="area">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15766.883613485581!2d13.220586682184022!3d-8.905518308413614!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-PT!2sao!4v1791482152751!5m2!1spt-PT!2sao"
                  width="600" height="450" allowfullscreen="" loading=" lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form class="box">
                <div class="questions-box">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Luana">
                </div>

                <div class="questions-box">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="luana@gmail.com">
                </div>

                <div class="questions-box">
                    <fieldset>
                        <legend>Message Purpose</legend>
                        <label><input type="radio" id="purpose" name="purpose"
                              value="general">General
                            Inquiry </label>

                        <label><input type="radio" id="purpose" name="purpose"
                              value="question">Reservation
                            Question</label>

                        <label><input type="radio" id="purpose" name="purpose"
                              value="sugestion">Website
                            Sugestion</label>
                    </fieldset>
                </div>

                <div class="questions-box">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type Here"></textarea>
                </div>


                <label><input type="checkbox" id="purpose" name="subscribe">Please subscribe me to
                    the
                    monthyly
                    newsletter
                </label>

                <button type="submit">Get in touch</button>

            </form>


        </section>


        <section class="adventure">
            <h2>We Are Here To Serve You!</h2>
            <figure>
                <img src="images/ben-rivero.jpg" alt="Employee Profile">
                <figcaption>Ben Rivero</figcaption>
            </figure>

            <figure>
                <img src="images/susan.jpg" alt="Employee Profile">
                <figcaption>Susan Black</figcaption>
            </figure>

            <figure>
                <img src="images/michael.jpg" alt="Employee Profile">
                <figcaption>Michael Souza</figcaption>
            </figure>

        </section>

        <footer>
            <p>©️ 2026 Angola Rafting | Isabel Sampaio</p>
            <nav class="socialmedia"><a href="https://www.facebook.com/"><img
                      src="images/facebook.svg" alt="Facebook Icon" width="20"></a>
                <a href="https://www.instagram.com/"><img src="images/instagram.svg"
                      alt="Instagram Icon" width="20"></a>
                <a href="https://www.tiktok.com/"><img src="images/tictok-bw.svg" alt="Tiktok Icon"
                      width="20"></a>
            </nav>
        </footer>

    </main>

</body>

</html>
